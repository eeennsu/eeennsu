name: Recent activity

on:
    schedule: # 6시간마다
        - cron: '0 */6 * * *'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Rewrite the marked block in README
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  OWNER: ${{ github.repository_owner }}
              run: |
                  gh api "users/$OWNER/events/public" --paginate > events.json
                  python3 .github/scripts/recent_activity.py
                  rm events.json

            - name: Commit if changed
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git diff --quiet README.md || {
                    git commit -am 'Update recent activity'
                    git push
                  }
